# Nixpacks build config for Railway
# Pins Node 20+ and uses the standard build/start scripts.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Do NOT use --omit=optional — Rollup ships its native binary as an optional dep
# (e.g. @rollup/rollup-linux-x64-gnu) and Vite's build will fail without it.
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server.js"
