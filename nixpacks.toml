# Nixpacks build config for Railway
# Pins Node 20+ and uses the standard build/start scripts.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Do NOT use --omit=optional — Next ships platform binaries (SWC, sharp) as
# optional deps and the build fails without them.
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
# next start binds $PORT, which Railway injects.
cmd = "npm run start"
